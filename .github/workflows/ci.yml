name: CI

on:
  # `types` stated explicitly: the default set does not include `edited`, so a PR retitled
  # after the title check went green kept the green check - and the squash subject is taken
  # from the title, so an unvalidated subject landed on main. Same hole for the
  # docs-freshness job, which reads DOCS_ACK out of the PR body.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Stated, not inherited. Nothing here writes to the repository: every job checks out,
# installs and runs checks. `contents: read` is the whole requirement, and saying so caps
# what a compromised step could reach. Artifact upload uses the Actions runtime token and
# needs no scope here.
permissions:
  contents: read

# Fast checks first. All are required to merge.
jobs:
  pr-title:
    name: PR title (the squashed commit subject)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci
      # The PR title becomes the commit subject under squash merge, so this gate -
      # not the local hook - is what protects the changelog. Same config as the hook.
      #
      # Through `env:`, never interpolated. The title is written by whoever opens the PR;
      # substituted into the script text it is arbitrary code on a runner that already has
      # the repository and the dependency tree, before any human has read the PR.
      - run: printf '%s\n' "$PR_TITLE" | npx commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  static:
    name: typecheck / lint / dead code / docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci
      - name: typecheck (library, isolatedDeclarations on)
        run: npx tsc --build
      - name: typecheck (tests and type-level tests)
        run: npx tsc -p tsconfig.test.json
      # The examples are the only consumer of the published types that lives in this
      # repository, and nothing was checking them: `bun build` and `node --strip-types` both
      # erase types without reading them, so the example compiled in the sense that it ran.
      - name: typecheck (examples, against the built types)
        run: npx tsc -p examples/chat
      - name: biome
        run: npx biome ci .
      - name: dead code
        run: npx knip
      - name: documentation
        run: bun run scripts/check-docs.ts
      - name: README prose budget
        run: bun run scripts/check-prose-budget.ts
      - name: retired claims stay retired
        run: bun run scripts/check-retired-claims.ts
      - name: workflows
        run: bun run scripts/check-workflows.ts
      - name: import boundaries
        run: bun run scripts/check-boundaries.ts
      - name: normative statements
        run: bun run scripts/check-norms.ts
      # Drives `tsc --lsp --stdio`. The compiler API does not exist until TS 7.1, but the
      # language server does, and hover is the only place the two-line contract pattern's
      # value can be observed at all.
      - name: hover width
        run: bun run scripts/check-hover.ts
      - name: gate inputs are not empty
        run: bun run scripts/check-gate-inputs.ts

  unit:
    name: unit tests (bun - never loads the transport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: integration tests (node - loads the transport)
    # glibc image. The linux prebuild needs GLIBC_2.38, so not Alpine and not a
    # default -slim tag, which are byte-identical to bookworm (glibc 2.36).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci
      - name: assert glibc >= 2.38
        run: |
          V=$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')
          echo "glibc $V"
          [ "$(printf '%s\n2.38\n' "$V" | sort -V | head -1)" = "2.38" ] || {
            echo "glibc $V is below 2.38; the transport prebuild will not load"; exit 1; }
      # No `--if-present`: a missing script must fail, not pass silently.
      - run: npm run test:node

  e2e:
    name: e2e (playwright, real chrome and real quic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci
      - name: assert glibc >= 2.38
        run: |
          V=$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')
          [ "$(printf '%s\n2.38\n' "$V" | sort -V | head -1)" = "2.38" ] || {
            echo "glibc $V is below 2.38; the transport prebuild will not load"; exit 1; }
      - run: npx playwright install --with-deps chromium
      # The example chat app IS the fixture, so the example cannot rot.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/

  publish-shape:
    name: pack validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci
      - run: npx tsc --build
      - run: npx attw --pack packages/core --profile esm-only
      - run: npx publint packages/core
      # The emitted .d.ts must be consumable by the oldest TypeScript we claim (D55).
      # Against the packed tarball in a temporary directory, both consumer resolution
      # modes, no --skipLibCheck. The two earlier in-repo shapes of this check were wrong
      # in opposite directions and the script's header records both.
      - name: consumer TypeScript floor (5.0)
        run: ./scripts/check-ts-floor.sh

  changeset:
    name: changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci
      - name: a package changed without a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if echo "$CHANGED" | grep -qE '^packages/[^/]+/src/'; then
            echo "$CHANGED" | grep -qE '^\.changeset/.+\.md$' || {
              echo "A package changed with no changeset."
              echo "Tooling and CI PRs take an empty one: npx changeset --empty"
              exit 1; }
          fi

  docs-freshness:
    name: source changed without documentation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - run: git fetch origin "$BASE_REF" --depth=1
        env:
          BASE_REF: ${{ github.base_ref }}
      # Recorded in CI rather than clicked past locally.
      - run: bun run scripts/docs-freshness.ts --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          DOCS_ACK: ${{ contains(github.event.pull_request.body, 'DOCS_ACK') && '1' || '0' }}
