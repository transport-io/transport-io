name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The link check runs under bun, like every other script in this repository.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci
      - run: npm -w site run build
      - name: internal links resolve under the base path
        run: npm run check:site-links
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: site deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
